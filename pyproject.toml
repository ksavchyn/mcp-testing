[project]
name = "mcp-custom-server"
version = "1.0.0"
description = "Custom MCP server with OBO authentication for Databricks"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "databricks-sdk"
]

[project.scripts]
custom-server = "server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"